<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY PORTFOLIO</title>
  <style>
    body {
      margin: 0;
      background: #080b12;
      color: #e8faff;
      font-family: sans-serif;
    }

    header {
      padding: 24px 8%;
      border-bottom: 1px solid #263449;
      color: #00ffe1;
      letter-spacing: 3px;
    }

    main {
      max-width: 900px;
      margin: 80px auto;
      padding: 0 24px;
    }

    .label {
      color: #00ffe1;
      letter-spacing: 4px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 76px);
      margin: 16px 0;
      text-shadow: 0 0 24px #00ffe155;
    }

    h2 {
      color: #00ffe1;
      border-left: 3px solid #00ffe1;
      padding-left: 12px;
    }

    section {
      margin-top: 64px;
      padding: 24px;
      border: 1px solid #263449;
      background: #0d1420;
      border-radius: 12px;
    }

    p {
      line-height: 1.9;
      color: #b9c9d8;
    }

    a {
      color: #00ffe1;
    }

    footer {
      padding: 32px;
      text-align: center;
      color: #68798b;
    }
  </style>
</head>
<body>
  <header>MY PORTFOLIO_</header>

  <main>
    <p class="label">WELCOME TO MY WORLD</p>
    <h1>Hello,<br>I'm a Creator.</h1>
    <p>
      アイデアを形にする。<br>
      プログラミングとものづくりの記録。
    </p>

    <section>
      <h2>PROFILE</h2>
      <p>ここに自己紹介を書こう。</p>
      <p>興味：プログラミング、アプリ制作、テクノロジー</p>
    </section>

    <section>
      <h2>PROJECTS</h2>
      <p><strong>瞬リプくん</strong></p>
      <p>画像リプを素早く探すための画像管理アプリ。</p>
      <p>Python / CustomTkinter</p>
    </section>

    <section>
      <h2>LINKS</h2>
      <p>
        <a href="https://github.com/">GitHub</a>
      </p>
    </section>
  </main>

  <footer>© MY PORTFOLIO</footer>
</body>
</html>
